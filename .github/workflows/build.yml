
name: Build TIPU APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract TIPU project
        run: |
          set -euo pipefail
          mkdir -p /tmp/tipu-source
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d /tmp/tipu-source
          PROJECT_DIR="$(find /tmp/tipu-source -name settings.gradle.kts -print -quit | xargs dirname)"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          cp -a "$PROJECT_DIR"/. .
      - name: Fix Java Kotlin Compatibility
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIPU-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

        
